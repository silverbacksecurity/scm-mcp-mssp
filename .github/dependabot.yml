version: 2

updates:
  # Python dependencies (uv/pip ecosystem)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch updates to reduce PR noise
      python-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # cryptography capped by pan-scm-sdk==0.15.1 at <50.0.0 — re-check this
      # cap whenever pan-scm-sdk is upgraded; tracked in soc2-controls.yaml
      - dependency-name: cryptography
        versions: [">=50.0.0"]
      # setuptools capped by pan-scm-sdk==0.15.1 at <79.0.0 — verified forcing
      # a newer setuptools breaks resolution against pan-scm-sdk's wheel
      # metadata. GHSA-h35f-9h28-mq5c / CVE-2026-59890 (PYSEC-2026-3447) fixed
      # in 83.0.0 is suppressed in CI (security-scan.yml) pending an upstream
      # SDK release; re-check this cap whenever pan-scm-sdk is upgraded.
      - dependency-name: setuptools
        versions: [">=79.0.0"]
    labels:
      - dependencies
      - python

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
